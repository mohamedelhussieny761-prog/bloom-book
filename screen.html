<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloom Screen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Tajawal:wght@400;500;700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Bloom Screen — the salon TV. Built for 1920×1080 seen from 3–4 m; scales with the screen. Meridian Zero. */
:root{--pink:#fdcddb;--ink:#141012;--rose:#c95d80;--gold:#b38a4a;--cream:#fff8fa;--muted:#6f5f66;font-size:clamp(10px,1.05vw,26px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);overflow:hidden;cursor:none}
body{font-family:"Tajawal","Figtree",system-ui,sans-serif}
.scr{display:grid;grid-template-columns:62fr 38fr;height:100vh}
.stage{position:relative;background:var(--pink);color:var(--ink);overflow:hidden}
.side{display:grid;grid-template-rows:auto 1fr auto;gap:2rem;padding:3rem 3rem 2.4rem;background:var(--ink)}
.brand{display:flex;align-items:center;gap:1.4rem;direction:ltr}
.brand img{width:6rem;height:6rem;border-radius:50%;box-shadow:0 0 0 .25rem var(--ink),0 0 0 .4rem var(--gold)}
.wm{font-family:"Playfair Display",serif;font-size:4.6rem;line-height:1}.wm i{font-style:normal;color:var(--rose)}
.tag{font-family:"Figtree",sans-serif;letter-spacing:.42em;font-size:1rem;color:var(--gold);margin-top:.4rem}
.clock{font-family:"Figtree",sans-serif;font-weight:600;font-size:8.5rem;line-height:1;direction:ltr;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.date{text-align:center;font-size:2rem;color:#e6cfd6;margin-top:.6rem}
.open{display:flex;justify-content:center;margin-top:1.6rem}
.open span{font-size:1.7rem;font-weight:700;padding:.5rem 1.5rem;border-radius:999px;border:.15rem solid currentColor}
.open .on{color:#8fe0b3}.open .off{color:#f4a3b9}
.qr{display:grid;grid-template-columns:11rem 1fr;gap:1.6rem;align-items:center;background:#211a1d;border:.12rem solid #3a2e33;border-radius:1.6rem;padding:1.4rem}
.qr svg{width:11rem;height:11rem;border-radius:.8rem;display:block}
.qr b{display:block;font-size:2.1rem;margin-bottom:.3rem}.qr span{font-size:1.4rem;color:#d9c3ca;line-height:1.4}
.ig{direction:ltr;color:var(--pink);font-weight:700;font-family:"Figtree",sans-serif;font-size:1.4rem;margin-top:.4rem;display:block}
.slide{position:absolute;inset:0;padding:5rem 5.5rem;display:grid;align-content:center;gap:1.8rem;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.kick{font-size:1.9rem;font-weight:800;letter-spacing:.06em;color:var(--rose)}
.slide h1{font-size:5.6rem;line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.slide h1.serif{font-family:"Playfair Display",serif;font-weight:500}
.slide p{font-size:2.3rem;line-height:1.45;margin:0;max-width:40ch;color:#3b2f34}
.list{display:grid;gap:1rem;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:baseline;gap:2rem;font-size:2.5rem;font-weight:700;padding:1.1rem 1.6rem;background:rgba(255,255,255,.55);border-radius:1.2rem}
.list li small{font-size:1.6rem;font-weight:500;color:var(--muted);display:block}
.price{white-space:nowrap;font-family:"Figtree",sans-serif;direction:ltr}
.price s{color:var(--muted);font-size:1.6rem;margin-inline-end:.6rem;font-weight:500}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem}
.grid4 div{background:rgba(255,255,255,.6);border-radius:1.4rem;padding:1.6rem 1.8rem}
.grid4 b{display:block;font-size:2.6rem}.grid4 span{font-size:1.7rem;color:#3b2f34;line-height:1.4}
.dots{position:absolute;bottom:2.2rem;inset-inline:0;display:flex;justify-content:center;gap:.7rem}
.dots i{width:.9rem;height:.9rem;border-radius:50%;background:rgba(20,16,18,.22)}.dots i.on{background:var(--ink)}
.foot{font-family:"Figtree",sans-serif;font-size:.9rem;letter-spacing:.18em;white-space:nowrap;color:#7a6a70;text-align:center;direction:ltr}
.hint{position:fixed;top:1rem;left:1rem;font:600 1rem Figtree,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:.5rem 1rem;border-radius:999px;transition:opacity .6s}
@media (orientation:portrait){.scr{grid-template-columns:1fr;grid-template-rows:62fr 38fr}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
<script src="config.js"></script>
</head>

let lang="ar", idx=0, slides=[];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const egp=(n,l)=>l==="ar"?`${N(n,l)} جنيه`:`${N(n,l)} EGP`;
function build(l){const A=l==="ar";const nm=x=>A?x.ar:x.en;
 const from=c=>{const ms=MENU.filter(m=>m.cat===c);return ms.length?Math.min(...ms.map(m=>m.price)):null};
 const top=c=>MENU.filter(m=>m.cat===c).slice(0,4);
 return [
  `<div class="kick">${A?"أهلاً بيكي في":"WELCOME TO"}</div><h1 class="serif">Bloom Nails &amp; Lashes</h1><p>${A?"رموش وأظافر وحواجب بإيد فنانات، في قلب كفر عبده. اقعدي واسترخي، إنتي في أمان 🌸":"Lashes, nails and brows by real artists, in the heart of Kafr Abdo. Sit back and relax 🌸"}</p>`,
  `<div class="kick">${A?"عروض The perfect pair":"THE PERFECT PAIR"}</div><h1>${A?"خدمتين بسعر أقل":"Two services for less"}</h1><ul class="list">${OFFERS.slice(0,4).map(o=>`<li><span>${esc(nm(o))}</span><span class="price">${o.was?`<s>${N(o.was,l)}</s>`:""}${egp(o.price,l)}</span></li>`).join("")}</ul>`,
  `<div class="kick">${A?"ستايلات الرموش":"LASH STYLES"}</div><h1>${A?"اختاري إطلالتك":"Choose your look"}</h1><div class="grid4">${STYLES.map(s=>`<div><b>${A?s[0]:s[1]}</b><span>${A?s[2]:s[3]}</span></div>`).join("")}</div>`,
  `<div class="kick">${A?"الرموش":"LASHES"}</div><h1>${A?"رموش من":"Lashes from"} ${egp(from("lashes")||250,l)}</h1><ul class="list">${top("lashes").map(m=>`<li><span>${esc(nm(m))}</span><span class="price">${egp(m.price,l)}</span></li>`).join("")}</ul>`,
  `<div class="kick">${A?"أظافر وحواجب وباديكير":"NAILS · BROWS · PEDICURE"}</div><h1>${A?"كل حاجة في مكان واحد":"All in one place"}</h1><ul class="list">${["nails","brows","pedi"].map(c=>from(c)!=null?`<li><span>${CATS[c][A?0:1]}</span><span class="price">${A?"من":"from"} ${egp(from(c),l)}</span></li>`:"").join("")}</ul>`,
  ...CARE.map(c=>`<div class="kick">${A?"نصيحة Bloom":"BLOOM TIP"}</div><h1>${A?c[0]:c[1]}</h1><ul class="list">${(A?c[2]:c[3]).map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul>`),
  `<div class="kick">${A?"كارت Bloom":"BLOOM CARD"}</div><h1>${A?"الزيارة السادسة هدية 🎁":"Your 6th lash visit is on us 🎁"}</h1><p>${A?"وهاتي صاحبتك، وانتو الاتنين ليكم خصم ١٠٪. اسألي الريسبشن عن كروت الهدايا.":"Bring a friend and you both get 10% off. Ask reception about gift cards."}</p>`
 ]}
function render(){const st=document.getElementById("stage");
 slides=build(lang);if(idx>=slides.length)idx=0;
 st.innerHTML=slides.map((h,i)=>`<section class="slide${i===idx?" on":""}" dir="${lang==="ar"?"rtl":"ltr"}" lang="${lang}">${h}</section>`).join("")+`<div class="dots" aria-hidden="true">${slides.map((_,i)=>`<i class="${i===idx?"on":""}"></i>`).join("")}</div>`;
 document.getElementById("qr-t").textContent=lang==="ar"?"احجزي زيارتك الجاية":"Book your next visit";
 document.getElementById("qr-s").textContent=lang==="ar"?"صوّري الكود بالموبايل واحجزي في دقيقة":"Scan with your phone, book in a minute";
}
function next(){idx++;if(idx>=slides.length){idx=0;lang=lang==="ar"?"en":"ar";render();return}
 document.querySelectorAll(".slide").forEach((s,i)=>s.classList.toggle("on",i===idx));document.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===idx))}
function tick(){const now=new Date();
 document.getElementById("clock").textContent=now.toLocaleTimeString("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
 document.getElementById("date").textContent=now.toLocaleDateString(lang==="ar"?"ar-EG":"en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"});
 const h=+now.toLocaleString("en-GB",{timeZone:TZ,hour:"2-digit",hour12:false}),dow=new Date(now.toLocaleDateString("en-CA",{timeZone:TZ})+"T12:00:00Z").getUTCDay();
 const on=dow!==CLOSED_DOW&&h>=OPEN&&h<CLOSE;
 document.getElementById("open").innerHTML=`<span class="${on?"on":"off"}">${on?(lang==="ar"?"مفتوح لحد ٨ بالليل":"Open until 8 pm"):(lang==="ar"?"مواعيدنا ١ الضهر – ٨ بالليل · الاتنين إجازة":"Open 1–8 pm · closed Monday")}</span>`}
function live(){if(!API)return;fetch(API.url+"/rest/v1/services?active=eq.true&select=*&order=sort",{headers:{apikey:API.key,"Accept-Profile":API.schema||"public","Content-Profile":API.schema||"public",Authorization:"Bearer "+API.key}}).then(r=>r.ok?r.json():null).then(rows=>{if(Array.isArray(rows)&&rows.length){MENU=rows.filter(r=>CATS[r.cat]&&+r.price>0).map(r=>({id:r.id,cat:r.cat,ar:r.name_ar,en:r.name_en,price:+r.price}));const lo=rows.filter(r=>r.cat==="offers"&&+r.price>0);if(lo.length)OFFERS=lo.map(r=>({ar:r.name_ar,en:r.name_en,price:+r.price,was:+r.was||0}));render()}}).catch(()=>{})}
render();tick();live();
setInterval(next,SLIDE_MS);setInterval(tick,15000);setInterval(live,30*60000);
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.style.opacity=0},8000);
const fs=()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})};
addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")fs()});addEventListener("click",fs);
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
