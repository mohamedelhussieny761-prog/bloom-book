<style>
/* Layout: phone app shell — pink brand header, one scrolling screen per tab, fixed bottom tab bar; booking flow adds a step strip and a sticky action bar */
:root{
  --bg:#fff8fa; --surface:#ffffff; --sunk:#fdeef2; --line:#f3d6df;
  --ink:#141012; --muted:#6f5f66; --pink:#fdcddb; --rose:#c95d80; --gold:#b38a4a;
  --btn:#141012; --btn-ink:#fdcddb; --ok:#2f7d5b;
  --f-brand:"Playfair Display", Georgia, serif;
  --f-ar:"Tajawal", system-ui, sans-serif; --f-en:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1f191c; --sunk:#2a2125; --line:#3a2e33;
  --ink:#fbeef2; --muted:#c2aab3; --pink:#4a2f39; --rose:#f19fb8; --gold:#d6b06f;
  --btn:#fdcddb; --btn-ink:#141012; --ok:#6fcf9e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1f191c; --sunk:#2a2125; --line:#3a2e33;
  --ink:#fbeef2; --muted:#c2aab3; --pink:#4a2f39; --rose:#f19fb8; --gold:#d6b06f;
  --btn:#fdcddb; --btn-ink:#141012; --ok:#6fcf9e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.6;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
html[lang="en"] body{font-family:var(--f-en);font-size:15.5px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto}
.hero{background:#fdcddb;color:#141012}
.hero .in{padding-block:18px 20px;display:flex;align-items:center;gap:14px}
.badge{flex:0 0 58px;height:58px;border-radius:50%;background:#fdcddb;display:grid;place-items:center;box-shadow:0 0 0 2px #fff,0 0 0 3px #b38a4a}
.badge svg{width:34px;height:34px}
.wm{font-family:var(--f-brand);font-size:33px;line-height:1;direction:ltr;display:block}
.wm i{font-style:normal;color:#c95d80}
.tag{font-family:var(--f-en);font-size:11px;letter-spacing:.3em;direction:ltr;display:block;margin-top:4px;color:#5a4a50}
html[dir="rtl"] .wm,html[dir="rtl"] .tag{text-align:right}
.lang{margin-inline-start:auto;font:inherit;font-weight:700;font-size:13px;border:1px solid #141012;background:transparent;color:#141012;border-radius:999px;padding:5px 12px;cursor:pointer}
h2{font-size:21px;font-weight:800;margin:0 0 10px;text-wrap:balance}
h3{font-size:15px;font-weight:800;margin:0 0 6px}
section{padding-block:14px}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;font:inherit;color:inherit;text-align:start;display:grid;gap:4px}
.tile .ic{font-size:22px}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:13px}
.welcome{background:var(--sunk);border-radius:20px;padding:18px;display:grid;gap:8px}
.welcome .big{font-family:var(--f-brand);font-size:26px;line-height:1.2}
html[dir="rtl"] .welcome .big{font-family:var(--f-ar);font-weight:800}
.perk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--sunk);font-size:14px}
.perk b{color:var(--rose)}
.steps{display:flex;gap:6px;padding-block:12px 2px;overflow-x:auto;scrollbar-width:none}
.steps span{flex:0 0 auto;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--btn);color:var(--btn-ink)}
.steps span.done{background:var(--pink);color:var(--ink)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cats button{flex:0 0 auto}
.list{display:grid;gap:10px}
.svc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit}
.svc[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--pink) inset;background:var(--sunk)}
.svc b{font-size:16.5px}
.svc small{grid-column:1/-1;color:var(--muted);font-size:13px}
.price{font-weight:800;white-space:nowrap;font-size:16.5px}
.price em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted)}
.chip{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.style{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{font:inherit;color:inherit;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;cursor:pointer;display:grid;gap:6px}
.st[aria-pressed="true"]{border-color:var(--gold);background:var(--sunk)}
.st svg{width:100%;height:34px}
.st small{color:var(--muted);font-size:12.5px;line-height:1.4}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.day{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 4px;cursor:pointer;text-align:center}
.day b{display:block;font-size:20px;line-height:1.1}
.day span{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.day[aria-pressed="true"] span{color:var(--btn-ink)}
.day:disabled{opacity:.35;cursor:not-allowed}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
label{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:70px}
.check{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)}
.check input{width:auto}
.pay{display:grid;gap:10px}
.payopt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;text-align:start;width:100%}
.payopt[aria-pressed="true"]{border-color:var(--gold);background:var(--sunk)}
.dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.payopt[aria-pressed="true"] .dot{border-color:var(--rose);background:radial-gradient(var(--rose) 45%,transparent 50%)}
.action{position:fixed;inset:auto 0 calc(64px + env(safe-area-inset-bottom,0px)) 0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
.action .in{max-width:560px;margin:0 auto;padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.sum{font-size:13.5px;color:var(--muted);min-width:0}
.sum b{display:block;color:var(--ink);font-size:17px}
.go{font:inherit;font-weight:800;font-size:15.5px;border:0;border-radius:999px;padding:11px 22px;background:var(--btn);color:var(--btn-ink);cursor:pointer;white-space:nowrap}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{font:inherit;font-weight:700;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:8px}
nav.tabbar{position:fixed;inset:auto 0 0 0;background:var(--bg);border-top:1px solid var(--line);z-index:7}
nav.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar button{font:inherit;font-size:12px;font-weight:700;background:none;border:0;color:var(--muted);padding:9px 4px 10px;cursor:pointer;display:grid;justify-items:center;gap:2px}
nav.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabbar button[aria-current="page"]{color:var(--ink)}
nav.tabbar button[aria-current="page"] svg{stroke:var(--rose)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block}.gal figcaption{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:18px}
.stamp.on{border:2px solid var(--gold);background:var(--pink)}
.loyal{background:linear-gradient(135deg,#fdcddb,#f6b8ca);color:#141012;border-radius:20px;padding:18px}
.loyal .wm{font-size:24px}
.loyal .note{color:#3b3436}
.hist{display:grid;gap:8px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details+details{margin-top:8px}
summary{cursor:pointer;font-weight:800}
details p,details li{font-size:14.5px;color:var(--muted)}
details ul{margin:8px 0 0;padding-inline-start:20px}
.done{text-align:center;padding-block:18px}
.ring{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:40px}
pre.msg{white-space:pre-wrap;font-family:inherit;background:var(--sunk);border-radius:14px;padding:12px;text-align:start;margin:0;font-size:14.5px}
.num{direction:ltr;display:inline-block;font-weight:800;letter-spacing:.03em;user-select:all}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
a.btnlink,.cp{font:inherit;font-weight:800;border-radius:999px;padding:11px 18px;text-decoration:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer}
.cp.alt{background:transparent;color:var(--ink);border-color:var(--line)}
footer{text-align:center;color:var(--gold);font-size:11.5px;letter-spacing:.14em;padding-block:18px;direction:ltr;font-family:var(--f-en)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){main>section{animation:in .22s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>
<script src="config.js"></script>
</head>

function lashSvg(n){let p="";const c=11;for(let i=0;i<c;i++){const x=8+i*(84/(c-1)),len=10+n*3+Math.sin(i/(c-1)*Math.PI)*8;for(let k=0;k<Math.min(n,3);k++){const dx=(k-(Math.min(n,3)-1)/2)*2.2;p+=`<path d="M${x} 30 q ${dx} -${len/2} ${dx*2+(i-5)*0.8} -${len}" stroke="currentColor" stroke-width="${n>3?1.4:1.1}" fill="none" stroke-linecap="round"/>`}}return `<svg viewBox="0 0 100 34" aria-hidden="true"><path d="M4 30 Q50 38 96 30" stroke="currentColor" stroke-width="1.6" fill="none"/>${p}</svg>`}

  </section>`;
}
function loadTaken(){if(!API)return;fetch(API.url+"/rest/v1/rpc/bloom_taken_slots",{method:"POST",headers:{apikey:API.key,Authorization:"Bearer "+API.key,"Content-Type":"application/json"},body:"{}"}).then(r=>r.ok?r.json():null).then(rows=>{if(Array.isArray(rows)){TAKEN=rows;if(st.tab==="book"&&st.step===1)render()}}).catch(()=>{})}
function vInfoStep(){
  return `<section><h2>${t("you")}</h2><div class="card grid">
   <label for="f-name">${t("name")}<input id="f-name" autocomplete="name" value="${esc(st.name)}"></label>
   <label for="f-phone">${t("mobile")}<input id="f-phone" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="01xxxxxxxxx" value="${esc(st.phone)}"></label>
   <label class="check"><input id="f-first" type="checkbox" ${st.first?"checked":""}> ${t("first")}</label>
   <label for="f-friend">${t("friend")}<input id="f-friend" inputmode="tel" dir="ltr" value="${esc(st.friend)}"></label>
   <label for="f-note">${t("notes")}<textarea id="f-note">${esc(st.note)}</textarea></label>
   ${isLash()&&st.first?`<div class="perk"><span>🧪</span><span>${t("patchTxt")}</span></div>`:""}
  </div></section>`;
}
function vPay(){
  const opt=(k,a,b)=>`<button class="payopt" data-pay="${k}" aria-pressed="${st.pay===k}"><span class="dot"></span><span><b>${a}</b><br><small class="note" style="margin:0">${b}</small></span></button>`;
  const sty=STYLES.find(s=>s.id===st.style);
  return `<section><h2>${t("pay")}</h2><div class="pay" role="group">
   ${opt("instapay",t("dep"),t("depSub"))}${opt("full",t("full")+" · "+N(total())+" "+t("egp"),t("fullSub"))}${opt("salon",t("salon"),t("salonSub"))}
  </div>
  ${st.pay!=="salon"&&CFG.instapay?`<p class="note">InstaPay: <span class="num">${esc(CFG.instapay)}</span></p>`:""}
  <div class="card" style="margin-top:12px"><b>${t("summary")}</b>${LIVE?"":`<p class="note">${t("estPrices")}</p>`}
   <p class="note">${st.picked.map(p=>esc(nm(p))).join(" + ")}${sty?` (${lang==="ar"?sty.ar:sty.en})`:""}<br>${esc(fmtDay(st.day))} · ${hourLabel(+st.time)}<br>${t("total")}: ${N(total())} ${t("egp")}</p>
   <p class="note">${t("policy")}</p></div>
  <label class="card" for="f-consent" style="margin-top:12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="f-consent" ${st.consent?"checked":""} style="margin-top:4px;width:18px;height:18px;flex:none"><span class="note" style="margin:0">${t("consent")}</span></label></section>`;
}
function message(){
  const sty=STYLES.find(s=>s.id===st.style), ar=lang==="ar";
  const pay={instapay:t("dep"),full:t("full")+` (${total()} ${t("egp")})`,salon:t("salon")}[st.pay];
  const h=+st.time, hh=h>12?h-12:h;
  const L=ar?{hi:"أهلاً Bloom 🌸 عايزة أحجز:",svc:"الخدمة",sty:" – ستايل ",day:"اليوم",at:" – الساعة ",name:"الاسم",mob:"الموبايل",first:"أول زيارة ✨",ref:"رشحتلي Bloom",note:"ملاحظات",tot:"الإجمالي",pay:"الدفع",ref2:"رقم الطلب"}
    :{hi:"Hello Bloom 🌸 I'd like to book:",svc:"Service",sty:" – style ",day:"Day",at:" at ",name:"Name",mob:"Mobile",first:"First visit ✨",ref:"Referred by",note:"Notes",tot:"Total",pay:"Payment",ref2:"Request ref"};
  return `${L.hi}
${L.svc}: ${st.picked.map(p=>p[lang]).join(" + ")}${sty?L.sty+(ar?sty.ar:sty.en):""}
${L.day}: ${fmtDay(st.day)}${L.at}${hh}${ar?(h<12?" ص":" م"):(h<12?" am":" pm")}
${L.name}: ${st.name}
${L.mob}: ${st.phone}
${st.first?L.first+"\n":""}${st.friend?L.ref+": "+st.friend+"\n":""}${st.note?L.note+": "+st.note+"\n":""}${L.tot}: ${total()} ${t("egp")}
${L.pay}: ${pay}${st.reqId?"\n"+L.ref2+": "+st.reqId.slice(0,8).toUpperCase():""}`;
}
function vDone(){
  const m=message();
  return `<section class="done"><div class="ring">🌸</div><h2>${st.sentOnline?t("sent"):t("lastStep")}</h2>${st.sentOnline?"":`<p class="note" style="color:var(--rose)">${t("notSent")}</p>`}
  <p class="note">${t("sendWA")}${st.pay!=="salon"?t("withShot"):""}.</p>
  <pre class="msg" id="msg" dir="${lang==="ar"?"rtl":"ltr"}">${esc(m)}</pre>
  <div class="row"><a class="btnlink" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent(m)}" target="_blank" rel="noopener">${t("openWA")}</a><button class="cp alt" id="cp" type="button">${t("copy")}</button></div>
  <p class="note" style="margin-top:14px">WhatsApp: <span class="num">${CFG.phone}</span></p>
  <div class="row"><button class="cp alt" id="again" type="button">${t("newB")}</button></div></section>`;
}
function nextRefill(){const b=me.bookings.find(x=>x.fill);if(!b)return null;const svc=MENU.find(m=>m.id===b.svc)||{ar:b.ar,en:b.en};return {date:addDays(b.day,b.fill),svc}}
function vMe(){
  const n=lashCount()%CFG.loyal, nr=nextRefill();
  const nextFree=n===CFG.loyal-1;
  return `<section class="grid">
   <div class="loyal"><span class="wm">Bloom<i>.</i></span><p class="note" style="margin:4px 0 0">${t("myTitle")}${me.name?" · "+esc(me.name):""}</p>
    <div class="stamps">${Array.from({length:CFG.loyal},(_,i)=>`<span class="stamp ${i<n?"on":""}">${i===CFG.loyal-1?"🎁":i<n?"🌸":""}</span>`).join("")}</div>
    <p class="note"><b>${N(n)}/${N(CFG.loyal)}</b> ${t("stampsOf")} · ${nextFree?t("free"):t("toFree").replace("{n}",N(CFG.loyal-1-n))}</p></div>
   <div class="card"><h3>${t("nextRefill")}</h3><p class="note">${nr?`<b>${esc(fmtDay(nr.date))}</b> — ${esc(nm(nr.svc))}`:t("noRefill")}</p>${nr?`<div style="margin-top:10px"><button class="go" data-rebook="0">${t("bookAgain")}</button></div>`:""}</div>
   <div class="card"><h3>${t("history")}</h3>${me.bookings.length?`<div class="hist">${me.bookings.slice(0,10).map(b=>`<div class="hrow"><span>${esc(b[lang]||b.ar)}</span><span>${esc(fmtDay(b.day))}</span></div>`).join("")}</div>`:`<p class="note">${t("noHist")}</p>`}</div>
   <p class="note">${t("localNote")}</p>
  </section>`;
}
function vInfo(){
  return `<section class="grid"><h2>${t("infoTitle")}</h2>
   <div class="card grid">
    <div><h3>${t("addr")}</h3><p class="note" style="margin:0">${lang==="ar"?"٣٣ شارع كرداحي، كفر عبده، الإسكندرية":"33 Kerdahy Street, Kafr Abdo, Alexandria"}</p><a href="${CFG.maps}" target="_blank" rel="noopener" style="color:var(--rose);font-weight:700">${t("map")}</a></div>
    <div><h3>${t("hours")}</h3><p class="note" style="margin:0">${t("hoursTxt")}</p></div>
    <div><h3>${t("call")}</h3><p class="note" style="margin:0"><span class="num">${CFG.phone}</span> · <span class="num">${CFG.land}</span></p></div>
    <div><h3>${t("insta")}</h3><a href="${CFG.instagram}" target="_blank" rel="noopener" style="color:var(--rose);font-weight:700;direction:ltr;display:inline-block">@bloomnailsandlashess</a></div>
   </div>
   <div><h3>${t("care")}</h3>${CATS.map(c=>`<details><summary>${lang==="ar"?c[1]:c[2]}</summary><ul>${CARE[c[0]][lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`).join("")}</div>
   <div><h3>${t("privT")}</h3><p class="note" style="margin:0">${t("privTxt")}</p></div>
   <div><h3>${t("faq")}</h3>${t("faqs").map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>
  </section>`;
}

/* ===== events ===== */
function bind(){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  on("[data-tab]",b=>{st.tab=b.dataset.tab;render();scrollTo(0,0)});
  on("[data-go]",b=>{if(b.dataset.offers){st.cat="offers";st.step=0}st.tab=b.dataset.go;render();scrollTo(0,0)});
  on("[data-gift]",()=>{st.showGift=!st.showGift;render()});
  on("[data-care]",b=>{st.careCat=st.careCat===b.dataset.care&&st.tab==="home"&&b.classList.contains("tile")?"":b.dataset.care;render()});
  on("[data-gv]",b=>{st.giftVal=+b.dataset.gv;render()});
  on("[data-cat]",b=>{st.cat=b.dataset.cat;render()});
  on("[data-svc]",b=>{const it=MENU.find(m=>m.id===b.dataset.svc);const i=st.picked.findIndex(p=>p.id===it.id);if(i>=0)st.picked.splice(i,1);else st.picked.push(it);if(!needStyle())st.style="";render()});
  on("[data-style]",b=>{st.style=b.dataset.style;render()});
  on("[data-day]",b=>{st.day=b.dataset.day;st.time="";loadTaken();render()});
  on("[data-time]",b=>{st.time=b.dataset.time;render()});
  on("[data-pay]",b=>{st.pay=b.dataset.pay;render()});
  on("[data-rebook]",()=>{const b=me.bookings[0];const it=MENU.find(m=>m.id===b.svc);st.picked=it?[it]:[];st.cat=it?it.cat:"lashes";st.step=0;st.tab="book";render();scrollTo(0,0)});
  const upd=()=>{const n=$("#next");if(n)n.disabled=!ok()};
  const f=(id,k,clean)=>{const el=$(id);if(el)el.oninput=()=>{st[k]=clean?normPhone(el.value):el.value;upd()}};
  f("#f-name","name");f("#f-phone","phone",1);f("#f-friend","friend",1);f("#f-note","note");
  const fi=$("#f-first");if(fi)fi.onchange=()=>{st.first=fi.checked;render()};
  const fc=$("#f-consent");if(fc)fc.onchange=()=>{st.consent=fc.checked;$("#next").disabled=!ok()};
  const gf=$("#g-from"),gt=$("#g-to"),gw=$("#g-wa");
  if(gw){const link=()=>{const msg=`أهلاً Bloom 🌸 عايزة كارت هدية بقيمة ${st.giftVal} جنيه\nمن: ${st.giftFrom||me.name||""}\nلـ: ${st.giftTo||""}`;gw.href=`https://wa.me/${CFG.wa}?text=${encodeURIComponent(msg)}`};
    gf.oninput=()=>{st.giftFrom=gf.value;link()};gt.oninput=()=>{st.giftTo=gt.value;link()};link()}
  const cp=$("#cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(message());cp.textContent=t("copied")}catch(e){const r=document.createRange();r.selectNodeContents($("#msg"));getSelection().removeAllRanges();getSelection().addRange(r);cp.textContent=t("selected")}};
  const ag=$("#again");if(ag)ag.onclick=()=>{Object.assign(st,{reqId:"",step:0,picked:[],style:"",day:"",time:"",note:"",friend:"",first:false,pay:"instapay",sentOnline:false,consent:false});render();scrollTo(0,0)};
}
let sending=false;
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g,()=>(Math.random()*16|0).toString(16)));
function lockUI(on){["#next","#back","#lang"].forEach(id=>{const e=$(id);if(e)e.disabled=on});document.querySelectorAll("#tabbar button").forEach(b=>b.disabled=on);const n=$("#next");if(n&&on)n.textContent=t("sending")}
async function confirmBooking(){
  if(!st.reqId)st.reqId=uuid();
  me.name=st.name;me.phone=st.phone;saveMe();
  st.sentOnline=false;
  if(API){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),15000);
    const body={services:st.picked.map(p=>({id:p.id,name:p.ar,price:p.price})),lash_style:st.style||null,day:st.day,time:st.time,name:st.name.trim(),phone:st.phone,friend:st.friend||null,first_visit:st.first,note:st.note||null,pay:st.pay,total:total(),lang,consent:true,consent_at:new Date().toISOString()};
    if(CFG.serverV2)body.request_id=st.reqId;
    try{const r=await fetch(API.url+"/rest/v1/booking_requests",{method:"POST",signal:ctl.signal,headers:{apikey:API.key,Authorization:"Bearer "+API.key,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});
      st.sentOnline=r.ok||r.status===409; /* 409 = this same request already arrived */
    }catch(e){st.sentOnline=false}finally{clearTimeout(tm)}
  }
  if(st.sentOnline){
    const lash=st.picked.some(p=>p.cat==="lashes"), fill=Math.max(0,...st.picked.map(p=>p.fill||0)), main=st.picked.find(p=>p.fill===fill)||st.picked[0];
    me.bookings.unshift({svc:main.id,ar:st.picked.map(p=>p.ar).join(" + "),en:st.picked.map(p=>p.en).join(" + "),day:st.day,fill,lash,ref:st.reqId});
    me.bookings=me.bookings.slice(0,30);saveMe();
  }
}
$("#next").onclick=async()=>{
  if(sending||!ok())return;
  if(st.step===3){
    if(!slotOk()){alert(t("slotGone"));st.step=1;st.time="";loadTaken();render();return}
    sending=true;lockUI(true);
    try{await confirmBooking()}finally{sending=false;lockUI(false)}
  }
  st.step=Math.min(4,st.step+1);render();scrollTo({top:0,behavior:"smooth"})};
$("#back").onclick=()=>{st.step=Math.max(0,st.step-1);render()};
$("#lang").onclick=()=>{if(sending)return;lang=lang==="ar"?"en":"ar";saveMe();render()};

/* hosted version: live prices from the Bloom database */
let LIVE=!API;
if(API){fetch(API.url+"/rest/v1/services?active=eq.true&select=*&order=sort",{headers:{apikey:API.key,Authorization:"Bearer "+API.key}}).then(r=>r.ok?r.json():null).then(rows=>{if(rows&&rows.length){LIVE=true;MENU=rows.map(r=>({id:r.id,cat:r.cat,ar:r.name_ar,en:r.name_en,price:r.price,min:r.minutes,fill:r.fill||0,style:!!r.style}));if(!MENU.some(m=>m.cat==="offers"))MENU=OFFERS.concat(MENU);render()}}).catch(()=>{});loadTaken()}
render();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
